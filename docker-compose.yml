name: chaincopy-observer

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chaincopy
      POSTGRES_PASSWORD: chaincopy
      POSTGRES_USER: chaincopy
      TZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chaincopy -d chaincopy"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://chaincopy:chaincopy@postgres:5432/chaincopy?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3001
      DATABASE_URL: postgresql://chaincopy:chaincopy@postgres:5432/chaincopy?schema=public
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-local-internal-secret-at-least-32-characters}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      TZ: Asia/Tokyo
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3001/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "3001:3001"
    restart: unless-stopped

  worker:
    stop_grace_period: 2m
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment:
      DATABASE_URL: postgresql://chaincopy:chaincopy@postgres:5432/chaincopy?schema=public
      HYPERLIQUID_API_URL: ${HYPERLIQUID_API_URL:-https://api.hyperliquid.xyz/info}
      HYPERLIQUID_HTTP_TIMEOUT_MS: ${HYPERLIQUID_HTTP_TIMEOUT_MS:-10000}
      HYPERLIQUID_NETWORK: ${HYPERLIQUID_NETWORK:-mainnet}
      HYPERLIQUID_SYNC_INTERVAL_MS: ${HYPERLIQUID_SYNC_INTERVAL_MS:-60000}
      HYPERLIQUID_WS_URL: ${HYPERLIQUID_WS_URL:-wss://api.hyperliquid.xyz/ws}
      HYPERLIQUID_API_WEIGHT_PER_MINUTE: ${HYPERLIQUID_API_WEIGHT_PER_MINUTE:-1200}
      HYPERLIQUID_DISCOVERY_ENABLED: ${HYPERLIQUID_DISCOVERY_ENABLED:-false}
      HYPERLIQUID_DISCOVERY_MODE: ${HYPERLIQUID_DISCOVERY_MODE:-MAJOR}
      HYPERLIQUID_DISCOVERY_PRIORITY_COINS: ${HYPERLIQUID_DISCOVERY_PRIORITY_COINS:-BTC,ETH,SOL,HYPE,SUI}
      HYPERLIQUID_DISCOVERY_MIN_TRADES: ${HYPERLIQUID_DISCOVERY_MIN_TRADES:-10}
      HYPERLIQUID_DISCOVERY_MIN_NOTIONAL_USD: ${HYPERLIQUID_DISCOVERY_MIN_NOTIONAL_USD:-10000}
      HYPERLIQUID_DISCOVERY_RECENT_HOURS: ${HYPERLIQUID_DISCOVERY_RECENT_HOURS:-24}
      HYPERLIQUID_DISCOVERY_ENRICHMENT_CONCURRENCY: ${HYPERLIQUID_DISCOVERY_ENRICHMENT_CONCURRENCY:-2}
      HYPERLIQUID_DISCOVERY_MIN_ENRICHMENT_INTERVAL_MIN: ${HYPERLIQUID_DISCOVERY_MIN_ENRICHMENT_INTERVAL_MIN:-1440}
      HYPERLIQUID_DISCOVERY_SCHEDULER_INTERVAL_MS: ${HYPERLIQUID_DISCOVERY_SCHEDULER_INTERVAL_MS:-10000}
      HYPERLIQUID_DISCOVERY_MAX_RECONNECT_ATTEMPTS: ${HYPERLIQUID_DISCOVERY_MAX_RECONNECT_ATTEMPTS:-12}
      HYPERLIQUID_DISCOVERY_KNOWN_SYSTEM_ADDRESSES: ${HYPERLIQUID_DISCOVERY_KNOWN_SYSTEM_ADDRESSES:-0x0000000000000000000000000000000000000000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      TZ: Asia/Tokyo
      WORKER_HEALTH_PORT: 3002
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "3002:3002"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    environment:
      ALLOWED_ADMIN_EMAIL: ${ALLOWED_ADMIN_EMAIL:-owner@example.com}
      API_BASE_URL: http://api:3001
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:-local-auth-secret-at-least-32-characters-long}
      DATABASE_URL: postgresql://chaincopy:chaincopy@postgres:5432/chaincopy?schema=public
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-replace-with-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-replace-with-google-client-secret}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-local-internal-secret-at-least-32-characters}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NEXTAUTH_URL: ${APP_BASE_URL:-http://localhost:3000}
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      TZ: Asia/Tokyo
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
