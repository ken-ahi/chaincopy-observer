packages:
  - apps/*
  - packages/*

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  msgpackr-extract: false
  prisma: true
  sharp: true
  unrs-resolver: true

catalogMode: strict

overrides:
  esbuild: 0.28.1
  postcss: 8.5.23
  sharp: 0.35.3

minimumReleaseAgeExclude:
  - "@playwright/test@1.62.0"
  - "@radix-ui/react-compose-refs@1.1.5"
  - "@radix-ui/react-slot@1.3.3"
  - bullmq@5.81.2
  - playwright-core@1.62.0
  - playwright@1.62.0
  - postcss@8.5.23
  - eslint@10.8.0
